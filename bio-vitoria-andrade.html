  <title>Vitória Andrade</title>
  <style>
    :root {
      color-scheme: light;
      --brown: #402A20;
      --brown-soft: #745748;
      --paper: #F3EEE7;
      --white: #FFFEFC;
      --line: rgba(64, 42, 32, .13);
      --muted: #77685F;
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Avenir Next", Avenir, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 30px 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--brown);
      background:
        radial-gradient(ellipse at 15% 12%, rgba(224, 207, 192, .54), transparent 34%),
        radial-gradient(ellipse at 90% 86%, rgba(229, 216, 203, .48), transparent 31%),
        var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .stage { width: min(100%, 440px); margin: auto; }
    .bio-card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      border: 1px solid rgba(64, 42, 32, .10);
      border-radius: 30px;
      background: var(--white);
      box-shadow: 0 28px 80px rgba(64, 42, 32, .13), 0 4px 14px rgba(64, 42, 32, .04);
    }
    .bio-card::before {
      position: absolute;
      z-index: -1;
      top: -105px;
      right: -115px;
      width: 245px;
      height: 245px;
      border: 1px solid rgba(116, 87, 72, .10);
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 22px rgba(116, 87, 72, .025), 0 0 0 48px rgba(116, 87, 72, .018);
    }
    .topbar {
      position: relative;
      z-index: 1;
      display: flex;
      height: 48px;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid rgba(64, 42, 32, .08);
      background: var(--white);
    }
    .topbar-symbol {
      display: block;
      width: 36px;
      height: auto;
      flex: 0 0 auto;
      object-fit: contain;
    }
    .topbar-logo {
      display: block;
      width: min(50vw, 165px);
      height: auto;
      flex: 0 1 auto;
      object-fit: contain;
    }
    .portrait-wrap {
      position: relative;
      height: clamp(330px, 108vw, 430px);
      margin: 0;
      overflow: hidden;
      background: var(--paper);
    }
    .portrait-wrap::after {
      position: absolute;
      inset: auto 0 0;
      height: 190px;
      background: linear-gradient(to bottom, rgba(255, 254, 252, 0) 0%, rgba(255, 254, 252, .72) 62%, var(--white) 100%);
      content: "";
      pointer-events: none;
    }
    .portrait {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 72%;
    }
    .content { position: relative; z-index: 1; margin-top: -44px; padding: 20px 30px 30px; }
    h1 {
      max-width: 360px;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(34px, 8.8vw, 44px);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: 1.08;
    }
    h1 span { color: #8A6D5C; font-style: italic; }
    .intro {
      margin: 18px 0 0;
      color: #65564E;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.68;
    }
    .intro + .intro { margin-top: 10px; }
    .actions { display: grid; gap: 11px; margin-top: 24px; }
    .action {
      position: relative;
      display: flex;
      min-height: 64px;
      align-items: center;
      gap: 14px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--brown);
      background: rgba(255, 254, 252, .92);
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .action:hover { transform: translateY(-2px); border-color: rgba(64, 42, 32, .28); box-shadow: 0 9px 20px rgba(64, 42, 32, .08); }
    .action:focus-visible { outline: 3px solid rgba(116, 87, 72, .38); outline-offset: 3px; }
    .action.primary {
      min-height: 66px;
      border-color: var(--brown);
      color: #FFFDF9;
      background: var(--brown);
      box-shadow: 0 8px 18px rgba(64, 42, 32, .15);
    }
    .action.primary:hover { border-color: #2F1E17; background: #2F1E17; box-shadow: 0 11px 24px rgba(64, 42, 32, .20); }
    .icon-box {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      place-items: center;
      border: 1px solid rgba(64, 42, 32, .11);
      border-radius: 12px;
      color: var(--brown);
      background: #F7F2EC;
    }
    .primary .icon-box { border-color: rgba(255,255,255,.22); color: white; background: rgba(255,255,255,.10); }
    .icon-box svg, .icon-box img { width: 25px; height: 25px; display: block; object-fit: contain; }
    .action-copy { display: grid; gap: 3px; text-align: left; }
    .action-copy strong { font-size: 16px; font-weight: 650; letter-spacing: .005em; }
    .action-copy small { color: var(--muted); font-size: 11px; line-height: 1.25; letter-spacing: -.02em; white-space: nowrap; }
    .primary .action-copy { flex: 1; text-align: left; }
    .primary .action-copy small { color: rgba(255,253,249,.73); }
    .arrow {
      width: 18px;
      height: 18px;
      margin-left: auto;
      flex: 0 0 18px;
      opacity: .72;
    }
    .primary .arrow { opacity: .9; }
    .signature {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 23px 0 0;
      color: #89786E;
      font-family: var(--serif);
      font-size: 14px;
      font-style: italic;
    }
    .signature::before, .signature::after { width: 23px; height: 1px; background: var(--line); content: ""; }
    @media (max-width: 480px) {
      body { display: block; padding: 0; background: var(--white); }
      .stage { width: 100%; min-height: 100svh; margin: 0; }
      .bio-card {
        min-height: 100svh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }
      .portrait-wrap { height: clamp(330px, 108vw, 430px); }
      .content { padding: 24px 25px 25px; }
    }
    @media (max-width: 375px) {
      .action-copy small { font-size: clamp(9px, 2.8vw, 10.5px); }
    }
    @media (max-width: 350px) {
      .content { padding-right: 20px; padding-left: 20px; }
      h1 { font-size: 34px; }
      .intro { font-size: 16px; }
    }
    html.js [data-reveal] {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity .65s ease var(--reveal-delay, 0ms), transform .65s cubic-bezier(.2, .7, .2, 1) var(--reveal-delay, 0ms);
    }
    html.js [data-reveal].is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      html.js [data-reveal] { opacity: 1; transform: none; transition: none; }
    }
  </style>
